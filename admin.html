<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4D2308">
<title>پنل مدیریت — کافه کتاب</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      primary: "#8A9992", "on-primary": "#22190F",
      secondary: "#55443A", background: "#4D2308",
      "on-surface-variant": "#CBB9A9"
    } } }
  }
</script>
<style>
  body{ font-family:'Vazirmatn', -apple-system, sans-serif; background:#3a2113; color:#EFE7DD; min-height:100vh; }
  .glass{ background:rgba(255,255,255,.05); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.10); }
  .glass-book{ background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-right:4px solid #8A9992; }
  input{ font-family:inherit; }
</style>
</head>
<body>

<div id="loginView" class="max-w-sm mx-auto px-5" style="padding-top:20vh">
  <div class="glass rounded-3xl p-7 text-center">
    <div class="text-3xl mb-3">📖</div>
    <h1 class="text-base font-bold mb-1">ورود مدیر — کافه کتاب</h1>
    <p class="text-xs text-on-surface-variant mb-6">این پنل فقط برای مدیریت کافه‌ست</p>
    <input type="email" id="loginEmail" placeholder="ایمیل" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm mb-3 focus:outline-none">
    <input type="password" id="loginPass" placeholder="رمز عبور" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm mb-4 focus:outline-none">
    <button id="loginBtn" class="w-full py-3 rounded-xl font-bold text-sm" style="background:#8A9992; color:#22190F">ورود</button>
    <div id="loginErr" class="text-[11px] mt-3 min-h-[14px]" style="color:#e2554f"></div>
  </div>
</div>

<div id="dashView" class="max-w-2xl mx-auto px-4 py-6" style="display:none">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-base font-bold">پنل مدیریت کافه کتاب</h1>
    <button id="logoutBtn" class="text-xs text-on-surface-variant underline">خروج</button>
  </div>

  <div class="grid grid-cols-3 gap-3 mb-6">
    <div class="glass rounded-2xl p-4 text-center">
      <div class="text-lg font-extrabold" style="color:#8A9992" id="statToday">۰ ت</div>
      <div class="text-[10px] text-on-surface-variant mt-1">فروش امروز</div>
    </div>
    <div class="glass rounded-2xl p-4 text-center">
      <div class="text-lg font-extrabold" style="color:#8A9992" id="statCount">۰</div>
      <div class="text-[10px] text-on-surface-variant mt-1">سفارش امروز</div>
    </div>
    <div class="glass rounded-2xl p-4 text-center">
      <div class="text-lg font-extrabold" style="color:#8A9992" id="statPending">۰</div>
      <div class="text-[10px] text-on-surface-variant mt-1">در انتظار تایید</div>
    </div>
  </div>

  <div class="flex gap-2 mb-5 overflow-x-auto">
    <div class="tab whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold cursor-pointer" data-f="active" style="background:#55443A">در جریان</div>
    <div class="tab whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold cursor-pointer bg-white/5 text-on-surface-variant" data-f="done">تحویل‌شده</div>
    <div class="tab whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold cursor-pointer bg-white/5 text-on-surface-variant" data-f="cancelled">لغوشده</div>
    <div class="tab whitespace-nowrap px-4 py-2 rounded-full text-xs font-bold cursor-pointer bg-white/5 text-on-surface-variant" data-f="all">همه</div>
  </div>

  <div id="ordersRoot"></div>
</div>

<script>
const STATUS_LABEL = { pending:'در انتظار تایید', confirmed:'تایید شد', preparing:'در حال آماده‌سازی', done:'تحویل داده شد', cancelled:'لغو شد' };
let currentFilter = 'active';
let allOrders = [];

async function checkSession() {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) showDashboard();
  else { document.getElementById('loginView').style.display = 'block'; document.getElementById('dashView').style.display = 'none'; }
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginErr');
  errBox.textContent = '';
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) { errBox.textContent = 'ایمیل یا رمز اشتباهه.'; return; }
  showDashboard();
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  checkSession();
});

function showDashboard() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashView').style.display = 'block';
  loadOrders();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => { t.style.background=''; t.classList.add('bg-white/5','text-on-surface-variant'); });
    tab.style.background = '#55443A';
    tab.classList.remove('bg-white/5','text-on-surface-variant');
    currentFilter = tab.dataset.f;
    renderOrders();
  });
});

async function loadOrders() {
  const { data, error } = await supabaseClient
    .from('orders').select('*, order_items(*)').order('created_at', { ascending: false }).limit(200);
  if (error) { console.error(error); return; }
  allOrders = data || [];
  renderStats();
  renderOrders();
}

function renderStats() {
  const today = new Date().toDateString();
  const todays = allOrders.filter(o => new Date(o.created_at).toDateString() === today && o.status !== 'cancelled');
  const total = todays.reduce((s, o) => s + o.total, 0);
  const pending = allOrders.filter(o => o.status === 'pending').length;
  document.getElementById('statToday').textContent = toFa(total) + ' ت';
  document.getElementById('statCount').textContent = toFa(todays.length);
  document.getElementById('statPending').textContent = toFa(pending);
}

function renderOrders() {
  const root = document.getElementById('ordersRoot');
  let list = allOrders;
  if (currentFilter === 'active') list = allOrders.filter(o => ['pending','confirmed','preparing'].includes(o.status));
  else if (currentFilter === 'done') list = allOrders.filter(o => o.status === 'done');
  else if (currentFilter === 'cancelled') list = allOrders.filter(o => o.status === 'cancelled');

  if (list.length === 0) { root.innerHTML = '<div class="text-center text-on-surface-variant text-xs py-10">سفارشی توی این دسته نیست</div>'; return; }

  root.innerHTML = list.map(o => `
    <div class="glass-book rounded-2xl p-4 mb-3">
      <div class="flex justify-between items-center mb-2">
        <span class="text-sm font-bold">سفارش #${toFa(o.id)} · ${STATUS_LABEL[o.status]}</span>
        <span class="text-[10px] text-on-surface-variant">${new Date(o.created_at).toLocaleString('fa-IR')}</span>
      </div>
      <div class="text-xs mb-1">${o.order_items.map(it => `${toFa(it.qty)} ${it.item_name}`).join('، ')}</div>
      ${o.customer_name ? `<div class="text-[11px] mb-1" style="color:#8A9992">👤 ${o.customer_name} — <a href="tel:${o.customer_phone}" class="underline">${o.customer_phone || ''}</a></div>` : `<div class="text-[11px] text-on-surface-variant mb-1">👤 مهمان (ثبت‌نام نکرده)</div>`}
      ${o.note ? `<div class="text-[11px] mb-2" style="color:#c9a97a">📝 ${o.note}</div>` : ''}
      <div class="flex items-center justify-between mt-2">
        <span class="font-bold text-sm" style="color:#8A9992">${toFa(o.total)} ت</span>
        <div class="flex gap-2">
          ${o.status === 'pending' ? `<button class="act-btn px-3 py-1.5 rounded-lg text-[11px] font-bold" style="background:#8A9992;color:#22190F" data-id="${o.id}" data-s="confirmed">تایید</button>` : ''}
          ${o.status === 'confirmed' ? `<button class="act-btn px-3 py-1.5 rounded-lg text-[11px] font-bold bg-white/10" data-id="${o.id}" data-s="preparing">در حال آماده‌سازی</button>` : ''}
          ${o.status === 'preparing' ? `<button class="act-btn px-3 py-1.5 rounded-lg text-[11px] font-bold" style="background:#2dc653;color:#0e2b16" data-id="${o.id}" data-s="done">تحویل داده شد</button>` : ''}
          ${['pending','confirmed','preparing'].includes(o.status) ? `<button class="act-btn px-3 py-1.5 rounded-lg text-[11px] font-bold border" style="color:#e2554f;border-color:rgba(226,85,79,.4)" data-id="${o.id}" data-s="cancelled">لغو</button>` : ''}
        </div>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.act-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const { error } = await supabaseClient.from('orders').update({ status: btn.dataset.s }).eq('id', btn.dataset.id);
      if (error) { alert('خطا در بروزرسانی سفارش'); console.error(error); return; }
      await loadOrders();
    });
  });
}

checkSession();
</script>
</body>
</html>
